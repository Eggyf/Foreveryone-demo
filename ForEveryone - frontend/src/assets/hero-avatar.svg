<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Retrato de un héroe de ForEveryone</title>
  <desc id="desc">Emblema de un yelmo alado con visor en T, en oro sobre piedra, con dos plumas</desc>

  <!--
    Retrato del héroe. Es un emblema, no un dibujo: la silueta del yelmo y el
    visor bastan para reconocerlo al tamaño al que se ve (140px dentro de una
    celda), y todo lo que no es contorno se omite, para que la forma se lea de un
    vistazo. Sin degradados ni sombras: solo oro sobre piedra, que es el material
    del resto de la aplicación.

    El visor en T es lo que dice "guerrero" sin dibujarlo entero.
  -->

  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="232" />
    </clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <!-- Piedra del medallón, con su fibra -->
    <rect width="512" height="512" fill="#16110d" />
    <g fill="none" stroke="#d8a93a" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 48h512M0 96h512M0 144h512M0 192h512M0 240h512M0 288h512M0 336h512M0 384h512M0 432h512M0 480h512" />
      <path d="M48 0v512M96 0v512M144 0v512M192 0v512M240 0v512M288 0v512M336 0v512M384 0v512M432 0v512M480 0v512" />
    </g>

    <g fill="none" stroke="#d8a93a" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Casco: cúpula que cierra arriba -->
      <path d="M150 268v-52c0-58 47-102 106-102s106 44 106 102v52" />

      <!-- Cresta del yelmo: sube por el centro y se abre en dos plumas. Es lo
           que hace que se lea como casco de guerrero y no como esferula. -->
      <path d="M256 116V72" />
      <path d="M256 116c-38-14-62-42-68-74 32 4 58 28 68 60z" fill="#d8a93a" />
      <path d="M256 116c38-14 62-42 68-74-32 4-58 28-68 60z" fill="#d8a93a" />

      <!-- Ala de la gorra, la línea que baja por detrás del visor -->
      <path d="M150 268v46h34" />
      <path d="M362 268v46h-34" />

      <!-- Visor: la barra horizontal y el nasal, que forman la T -->
      <path d="M158 250h196" />
      <path d="M256 250v52" />
      <!-- Ranuras del visor: oscuras, para que se lean como huecos -->
      <path d="M182 274h30M300 274h30" stroke="#16110d" stroke-width="5" />

      <!-- Mandíbula y barbiquejo -->
      <path d="M214 344h84" />
      <path d="M232 316h48v28h-48z" stroke-width="6" />

      <!-- Hombreras: el cuerpo se insinúa, no se dibuja entero -->
      <path d="M132 470v-34c0-26 24-44 58-50" />
      <path d="M380 470v-34c0-26-24-44-58-50" />
    </g>

    <!-- Plumas: el único relleno de oro macizo del emblema -->
    <path d="M256 118c-40-16-66-46-72-80 34 6 62 32 72 64z" fill="#d8a93a" />
    <path d="M256 118c40-16 66-46 72-80-34 6-62 32-72 64z" fill="#d8a93a" />

    <!-- Punto de oro en la frente: el remache del casco -->
    <circle cx="256" cy="196" r="7" fill="#d8a93a" />
  </g>

  <!-- Filete del medallón -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#d8a93a" stroke-width="6" />
</svg>